          window.location.replace('/');

        }
        function hideAuthLinks() {
          var elements = document.querySelectorAll('a[href*="/auth"], a[href*="/login"], button[data-auth], [routerlink*="/auth"], [routerLink*="/auth"]');
          elements.forEach(function (element) {
            element.setAttribute('aria-hidden', 'true');
            element.style.display = 'none';
          });
        }
        document.addEventListener('click', function (event) {
          var element = event.target && event.target.closest ? event.target.closest('a,button') : null;
          if (!element) return;
          var href = element.getAttribute('href') || element.getAttribute('routerlink') || element.getAttribute('routerLink') || '';
          if (/\/auth(?:\/|$)|\/login(?:\/|$)/i.test(href)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            window.location.replace('/');
          }
        }, true);
        var observer = new MutationObserver(hideAuthLinks);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        hideAuthLinks();
      })();
    </script>
