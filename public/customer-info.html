<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات العميل - شركة تدبير للاستقدام</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">بيانات العميل وحجز الخدمة</h1>
            <p class="text-gray-500 mt-2">يرجى إدخال بياناتك لإتمام عملية الحجز الانتقال إلى صفحة الدفع</p>
        </div>

        <form id="customerForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">اسم العميل الكامل</label>
                    <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="الاسم الكريم">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">رقم الجوال</label>
                    <input type="tel" id="phone" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="05XXXXXXXX">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">المدينة / المنطقة</label>
                    <input type="text" id="city" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="أبوظبي، دبي، الشارقة...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                    <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="example@domain.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">عنوان التوصيل أو تفاصيل الإقامة</label>
                <textarea id="address" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="تفاصيل العنوان بالتفصيل"></textarea>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 flex justify-between items-center">
                <span class="text-gray-700 font-medium">المبلغ الإجمالي المستحق:</span>
                <span id="totalAmount" class="text-xl font-bold text-blue-600">2,500 درهم</span>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition duration-200 text-lg shadow-md">
                متابعة وإتمام الحجز والدفع
            </button>
        </form>
    </div>

    <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const customerData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                amount: '2500',
                date: new Date().toISOString()
            };
            localStorage.setItem('tadbeer_customer', JSON.stringify(customerData));
            window.location.href = '/payment.html';
        });
    </script>
</body>
</html>
